<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 128" width="430" height="128" role="img" aria-label="Lensing">
  <!--
    Lensing: the framework shapes itself around your data the way mass bends
    light. Central mass = the data (signal orange); rays = the framework,
    deflected and converging behind it; dashed circle = the Einstein ring.
  -->
  <g fill="none" stroke="#5b6678" stroke-width="3" stroke-linecap="round">
    <path d="M6 26 C 48 26, 86 40, 122 58" opacity="0.65"/>
    <path d="M6 102 C 48 102, 86 88, 122 70" opacity="0.65"/>
    <path d="M6 46 C 46 46, 78 55, 122 84"/>
    <path d="M6 82 C 46 82, 78 73, 122 44"/>
  </g>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#5b6678" stroke-width="1.6"
          stroke-dasharray="2.5 5" opacity="0.55"/>
  <circle cx="64" cy="64" r="6.5" fill="#c98a2b"/>
  <text x="148" y="83" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="52" font-weight="600" letter-spacing="3" fill="#5b6678">lensing</text>
</svg>
