<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anim-lab · órbita en la curvatura</title>
<style>
  :root{
    --chrome: oklch(0.27 0.025 250);
    --on-chrome: oklch(0.96 0.008 250);
    --on-chrome-dim: oklch(0.78 0.015 250);
    --on-chrome-faint: oklch(0.66 0.02 250);
  }
  *{box-sizing:border-box;margin:0}
  body{
    background:var(--chrome);
    background-image:radial-gradient(140% 120% at 78% -10%, oklch(0.34 0.03 255) 0%, transparent 55%);
    color:var(--on-chrome);
    font-family:system-ui,-apple-system,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding:2rem;
  }
  h1{font-size:1.05rem;font-weight:600;letter-spacing:-0.01em;color:var(--on-chrome-dim)}
  h1 b{color:var(--on-chrome)}
  .stage{width:100%;max-width:920px}
  .stage svg{width:100%;height:auto;display:block}
  .cap{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:0.82rem;color:var(--on-chrome-faint);text-align:center;line-height:1.5;max-width:60ch}
  .cap b{color:var(--on-chrome)}
</style>
</head>
<body>
  <h1>slide 9 · <b>órbita siguiendo la curvatura</b> — iteración</h1>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <radialGradient id="mglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="oklch(0.92 0.13 85)" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="oklch(0.8 0.12 70)"  stop-opacity="0.13"/>
      <stop offset="100%" stop-color="oklch(0.8 0.12 70)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="66%">
      <stop offset="0%"  stop-color="oklch(0.27 0.025 250)" stop-opacity="0"/>
      <stop offset="68%" stop-color="oklch(0.27 0.025 250)" stop-opacity="0"/>
      <stop offset="100%" stop-color="oklch(0.27 0.025 250)" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="0.8"/></filter>
  </defs></svg>

  <div class="stage">
    <svg id="svg" viewBox="0 0 220 150" aria-hidden="true">
      <g class="g-grid"></g>
      <rect class="g-vig" x="0" y="0" width="220" height="150" fill="url(#vig)"></rect>
      <g class="g-trail"></g>
      <g class="g-back"></g>
      <g class="g-mass"></g>
      <g class="g-front"></g>
    </svg>
  </div>
  <div class="cap">Órbita kepleriana — acelera en el periastro (cerca de la masa) y frena en el apoastro; el eje precesa formando un rosetón. La masa está en el foco.</div>

<script>
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const svg=document.getElementById("svg");
const G={grid:svg.querySelector(".g-grid"),trail:svg.querySelector(".g-trail"),
         back:svg.querySelector(".g-back"),mass:svg.querySelector(".g-mass"),front:svg.querySelector(".g-front")};
function clear(g){while(g.firstChild)g.removeChild(g.firstChild);}

// ---- tilted plane with a gaussian gravity well ----
const cx=110, cy=54, halfW=100, halfD=48, sigma=0.40;
function project(u,v,amp){
  const r2=u*u+v*v;
  const sag=amp*Math.exp(-r2/(2*sigma*sigma));
  const persp=0.5+0.5*((v+1)/2);
  return [cx+u*halfW*persp, cy+v*halfD+sag];
}
function drawGrid(amp){
  clear(G.grid); const N=24;
  const line=(d,op)=>G.grid.appendChild(el("path",{d,fill:"none",stroke:"oklch(0.74 0.02 250)","stroke-width":0.45,opacity:op}));
  for(let i=0;i<=12;i++){ const v=-1+i*(2/12); let d="";
    for(let j=0;j<=N;j++){ const [x,y]=project(-1+j*(2/N),v,amp); d+=(j?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";}
    line(d, 0.5);
  }
  for(let i=0;i<=12;i++){ const u=-1+i*(2/12); let d="";
    for(let j=0;j<=N;j++){ const [x,y]=project(u,-1+j*(2/N),amp); d+=(j?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";}
    line(d, 0.5);
  }
}
function drawMass(amp){
  clear(G.mass);
  const [mx,my]=project(0,0,amp);
  G.mass.appendChild(el("circle",{cx:mx,cy:my,r:21,fill:"url(#mglow)"}));
  G.mass.appendChild(el("circle",{cx:mx,cy:my,r:11,fill:"none",stroke:"oklch(0.9 0.08 88)","stroke-width":0.5,opacity:0.28,filter:"url(#soft)"})); // faint lensing ring
  G.mass.appendChild(el("circle",{cx:mx,cy:my,r:6.2,fill:"oklch(0.14 0.02 262)"}));
  G.mass.appendChild(el("circle",{cx:mx,cy:my,r:6.2,fill:"none",stroke:"oklch(0.88 0.12 85)","stroke-width":0.8,opacity:0.8,filter:"url(#soft)"}));
}

// ---- keplerian orbit, mass at focus ----
const A_=0.62, E_=0.5, T_=6.0, WDOT=0.22;
function kepler(t){
  let M=2*Math.PI*(t/T_); let E=M;
  for(let i=0;i<6;i++) E=E-(E-E_*Math.sin(E)-M)/(1-E_*Math.cos(E));
  const nu=2*Math.atan2(Math.sqrt(1+E_)*Math.sin(E/2), Math.sqrt(1-E_)*Math.cos(E/2));
  const r=A_*(1-E_*Math.cos(E));
  const ang=nu+WDOT*t;
  return {u:r*Math.cos(ang), v:r*Math.sin(ang), r};
}
function drawOrbit(t,amp){
  clear(G.trail); clear(G.back); clear(G.front);
  const NT=150, step=0.06;
  // fading trail (bright head -> vanishing tail)
  let px=null,py=null;
  for(let k=0;k<=NT;k++){
    const p=kepler(t-k*step);
    const [x,y]=project(p.u,p.v,amp);
    if(px!==null){
      const f=1-k/NT;                       // 1 at head .. 0 at tail
      G.trail.appendChild(el("line",{x1:px,y1:py,x2:x,y2:y,
        stroke:"oklch(0.86 0.12 232)","stroke-width":(0.35+0.7*f).toFixed(2),
        "stroke-linecap":"round",opacity:(0.55*f*f).toFixed(3)}));
    }
    px=x;py=y;
  }
  // companion now (depth-ordered around the mass)
  const p=kepler(t);
  const [x,y]=project(p.u,p.v,amp);
  const near=(p.v+1)/2, rad=1.5+1.8*near;
  const bright=1.15-0.5*((p.r-A_*(1-E_))/(A_*2*E_));   // a touch brighter near periapsis
  const g = p.v>=0 ? G.front : G.back;
  g.appendChild(el("circle",{cx:x,cy:y,r:rad*2.8,fill:"oklch(0.84 0.12 232)",opacity:(0.18*bright).toFixed(3),filter:"url(#soft)"}));
  g.appendChild(el("circle",{cx:x,cy:y,r:rad,fill:"oklch(0.93 0.07 228)"}));
}

function render(t){
  const amp=37+3*Math.sin(t*0.55);
  drawGrid(amp); drawOrbit(t,amp); drawMass(amp);
}
const _qt=new URLSearchParams(location.search).get("t");
if(_qt!==null){ render(parseFloat(_qt)); }
else{ let t0=null; (function f(ts){ if(t0===null)t0=ts; render((ts-t0)/1000); requestAnimationFrame(f); })(performance.now()); }
</script>
</body>
</html>
