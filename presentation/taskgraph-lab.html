<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskgraph-lab · tareas y artefactos</title>
<style>
  :root{
    --bg: oklch(0.992 0 0);
    --surface: oklch(0.972 0.002 250);
    --surface-sunken: oklch(0.95 0.003 250);
    --ink: oklch(0.24 0.02 260);
    --ink-secondary: oklch(0.45 0.012 250);
    --ink-faint: oklch(0.56 0.01 250);
    --hairline: oklch(0.9 0.004 250);
    --hairline-strong: oklch(0.82 0.005 250);
    --accent: oklch(0.68 0.18 47);
    --accent-text: oklch(0.5 0.155 42);
    --accent-soft: oklch(0.95 0.025 55);
    --good: oklch(0.5 0.105 155);
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;padding:1.6rem 2rem}
  h1{font-size:1.05rem;font-weight:650;letter-spacing:-0.01em;margin-bottom:0.2rem}
  p.sub{color:var(--ink-secondary);font-size:0.9rem;margin-bottom:0.8rem}
  .wrap{max-width:1180px}
  svg#tg{width:100%;height:auto;display:block}
  .tg-node{fill:var(--surface);stroke:var(--hairline-strong);stroke-width:1.4}
  .tg-node.src{fill:var(--surface-sunken);stroke-dasharray:5 4}
  .tg-title{fill:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:18.5px;font-weight:650;text-anchor:middle}
  .tg-who{fill:var(--accent-text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;text-anchor:middle}
  .tg-edge{fill:none;stroke:var(--ink-faint);stroke-width:1.7}
  .tg-edge.loop{stroke:var(--accent);stroke-dasharray:6 4}
  .tg-arrow{fill:var(--ink-faint)}
  .tg-arrow.loop{fill:var(--accent)}
  .tg-elabel{fill:var(--ink-secondary);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13.5px;text-anchor:middle}
  .tg-elabel.loop{fill:var(--accent-text)}
  .tg-elabel-bg{fill:var(--bg)}
  .gi-stroke{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .gi-fill{fill:var(--ink)}
  .gi-accent{fill:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>taskgraph-lab · qué produce cada tarea, y quién lo usa</h1>
  <p class="sub">nodos = tareas · flechas = artefactos (la salida de una es la entrada de otra)</p>
  <svg id="tg" viewBox="0 0 1200 470" aria-hidden="true">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" class="tg-arrow"/></marker>
      <marker id="ahl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" class="tg-arrow loop"/></marker>
    </defs>
    <g class="edges"></g>
    <g class="nodes"></g>
    <g class="labels"></g>
  </svg>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("tg");
const gEdges=svg.querySelector(".edges"), gNodes=svg.querySelector(".nodes"), gLabels=svg.querySelector(".labels");
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}

const NH=94;                       // node height
const N={
  corpus:{t:"corpus",   who:"Qdrant",               x:86,  y:240, w:120, ill:"db",  src:true},
  probe: {t:"sondea el corpus", who:"bootstrap",     x:152, y:84,  w:188, ill:"cluster"},
  data:  {t:"construye el dataset", who:"dataset-architect", x:360, y:182, w:212, ill:"matrix"},
  design:{t:"propone el scan", who:"experiment-designer", x:360, y:362, w:206, ill:"grid"},
  run:   {t:"corre los runs", who:"experiment-runner", x:566, y:238, w:184, ill:"heatmap"},
  pdf:   {t:"consolida el informe", who:"report-curator", x:856, y:86, w:206, ill:"pages"},
  prom:  {t:"promueve el modelo", who:"best-model-selector", x:860, y:300, w:210, ill:"star"},
  onnx:  {t:"exporta a ONNX", who:"/model-export", x:1074, y:188, w:172, ill:"package"},
  show:  {t:"publica el showcase", who:"showcase-builder", x:1064, y:392, w:212, ill:"browser"},
};
const E=[
  ["corpus","probe","","t","b"],
  ["corpus","data","embeddings","r","l"],
  ["probe","data","domain.toml","r","t"],
  ["data","run","dataset","r","t"],
  ["design","run","diseño","t","l"],
  ["run","pdf","reportes","r","l"],
  ["run","prom","métricas","r","l"],
  ["run","design","PROJECT-FACTS","b","r",true],
  ["prom","onnx","modelo","r","l"],
  ["prom","show","modelo","r","l"],
  ["onnx","show","bundle","b","t"],
];

function anchor(n,s){const hw=n.w/2, hh=NH/2; if(s==="l")return[n.x-hw,n.y]; if(s==="r")return[n.x+hw,n.y]; if(s==="t")return[n.x,n.y-hh]; return[n.x,n.y+hh];}
function push(p,s,k){if(s==="l")return[p[0]-k,p[1]]; if(s==="r")return[p[0]+k,p[1]]; if(s==="t")return[p[0],p[1]-k]; return[p[0],p[1]+k];}
function bez(a,c1,c2,b,t){const u=1-t;return[u*u*u*a[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*b[0], u*u*u*a[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*b[1]];}

// ---- task glyphs (drawn centered at gx,gy) ----
function glyph(kind,gx,gy,p){
  const G=el("g",{},p);
  const S=(t,a)=>el(t,a,G);
  if(kind==="db"){
    S("ellipse",{cx:gx,cy:gy-9,rx:13,ry:4.5,class:"gi-stroke"});
    S("path",{d:`M${gx-13} ${gy-9} V${gy+9} A13 4.5 0 0 0 ${gx+13} ${gy+9} V${gy-9}`,class:"gi-stroke"});
    S("path",{d:`M${gx-13} ${gy} A13 4.5 0 0 0 ${gx+13} ${gy}`,class:"gi-stroke"});
  } else if(kind==="cluster"){
    const pts=[[-13,-4],[-5,5],[5,-7],[13,4],[-9,-9],[8,9],[1,-1]];
    pts.forEach(o=>S("circle",{cx:gx+o[0],cy:gy+o[1],r:1.9,class:"gi-fill"}));
    S("circle",{cx:gx+1,cy:gy-1,r:6.5,fill:"none",stroke:"var(--accent)","stroke-width":1.6});
  } else if(kind==="matrix"){
    S("rect",{x:gx-16,y:gy-13,width:32,height:26,rx:2.5,class:"gi-stroke"});
    S("rect",{x:gx-16,y:gy-13,width:32,height:8,rx:2.5,class:"gi-accent",opacity:0.25});
    [-5.3,5.3].forEach(dx=>S("line",{x1:gx+dx,y1:gy-13,x2:gx+dx,y2:gy+13,class:"gi-stroke","stroke-width":0.9,opacity:0.6}));
    [ -1.5,7].forEach(dy=>S("line",{x1:gx-16,y1:gy+dy,x2:gx+16,y2:gy+dy,class:"gi-stroke","stroke-width":0.9,opacity:0.6}));
  } else if(kind==="grid"){
    S("rect",{x:gx-15,y:gy-13,width:30,height:26,rx:2.5,class:"gi-stroke","stroke-dasharray":"3 2.4"});
    [-5,5].forEach(dx=>S("line",{x1:gx+dx,y1:gy-13,x2:gx+dx,y2:gy+13,class:"gi-stroke","stroke-width":0.9,opacity:0.5}));
    [-4.3,4.3].forEach(dy=>S("line",{x1:gx-15,y1:gy+dy,x2:gx+15,y2:gy+dy,class:"gi-stroke","stroke-width":0.9,opacity:0.5}));
  } else if(kind==="heatmap"){
    const v=[[0.85,0.3,0.55,0.15],[0.4,0.7,0.95,0.5],[0.2,0.45,0.6,0.8]];
    const c=7.2,g=1.4, x0=gx-(4*c+3*g)/2, y0=gy-(3*c+2*g)/2;
    for(let r=0;r<3;r++)for(let k=0;k<4;k++)S("rect",{x:x0+k*(c+g),y:y0+r*(c+g),width:c,height:c,rx:1,fill:"var(--accent)",opacity:(0.15+0.8*v[r][k]).toFixed(2)});
  } else if(kind==="pages"){
    S("rect",{x:gx-11,y:gy-13,width:24,height:30,rx:2,class:"gi-stroke",opacity:0.4});
    S("path",{d:`M${gx-15} ${gy-9} h18 l6 6 v22 h-24 z`,fill:"var(--surface)",class:"gi-stroke"});
    S("path",{d:`M${gx+3} ${gy-9} v6 h6`,class:"gi-stroke"});
    [2,8,14].forEach(dy=>S("line",{x1:gx-11,y1:gy+dy,x2:gx+5,y2:gy+dy,class:"gi-stroke","stroke-width":1,opacity:0.55}));
  } else if(kind==="star"){
    S("path",{d:"M0 -3 L3 8 L11 12 L4 16 L6 25 L0 19 L-6 25 L-4 16 L-11 12 L-3 8 Z",transform:`translate(${gx} ${gy-18}) scale(0.9)`,class:"gi-accent"});
    [[-11,9],[ -1,4],[9,12]].forEach((b,i)=>{const h=[10,18,8][i];S("rect",{x:gx+b[0],y:gy+13-h,width:7,height:h,rx:1,class:"gi-fill",opacity:i===1?0.9:0.45});});
  } else if(kind==="package"){
    S("path",{d:`M${gx} ${gy-13} l13 7 v14 l-13 7 l-13 -7 v-14 z`,fill:"var(--surface)",class:"gi-stroke"});
    S("path",{d:`M${gx-13} ${gy-6} l13 7 l13 -7`,class:"gi-stroke"});
    S("path",{d:`M${gx} ${gy+1} v14`,class:"gi-stroke"});
  } else if(kind==="browser"){
    S("rect",{x:gx-17,y:gy-13,width:34,height:26,rx:2.5,class:"gi-stroke"});
    S("line",{x1:gx-17,y1:gy-5,x2:gx+17,y2:gy-5,class:"gi-stroke","stroke-width":1.2});
    [-13,-9.5,-6].forEach(dx=>S("circle",{cx:gx+dx,cy:gy-9,r:1.1,class:"gi-fill"}));
    S("polyline",{points:`${gx-11},${gy+8} ${gx-4},${gy+2} ${gx+2},${gy+5} ${gx+12},${gy-2}`,class:"gi-stroke","stroke-width":1.4});
  }
  return G;
}

function drawNode(n){
  const hw=n.w/2, hh=NH/2;
  el("rect",{x:n.x-hw,y:n.y-hh,width:n.w,height:NH,rx:11,class:"tg-node"+(n.src?" src":"")},gNodes);
  glyph(n.ill, n.x, n.y-19, gNodes);
  el("text",{x:n.x,y:n.y+20,class:"tg-title"},gNodes).textContent=n.t;
  el("text",{x:n.x,y:n.y+37,class:"tg-who"},gNodes).textContent=n.who;
}
function drawEdge([fk,tk,label,fs,ts,loop]){
  const a=anchor(N[fk],fs), b=anchor(N[tk],ts), K=58;
  const c1=push(a,fs,K), c2=push(b,ts,K);
  const cls="tg-edge"+(loop?" loop":"");
  el("path",{d:`M${a[0]} ${a[1]} C ${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${b[0]} ${b[1]}`,class:cls,"marker-end":`url(#${loop?"ahl":"ah"})`},gEdges);
  if(label){
    const m=bez(a,c1,c2,b,0.5);
    const w=label.length*7.4+10;
    el("rect",{x:m[0]-w/2,y:m[1]-9,width:w,height:18,rx:3,class:"tg-elabel-bg"},gLabels);
    el("text",{x:m[0],y:m[1]+4.5,class:"tg-elabel"+(loop?" loop":"")},gLabels).textContent=label;
  }
}
E.forEach(drawEdge);
Object.values(N).forEach(drawNode);
</script>
</body>
</html>
