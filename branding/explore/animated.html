<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lensing — motion study</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 28px;
    background: #11161c; color: #b0b8c1;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 48px 20px;
  }
  .stage { display: grid; place-items: center; gap: 14px; }
  .card {
    width: min(560px, 88vw); aspect-ratio: 16 / 10; border-radius: 18px;
    background: #1d2732; border: 1.5px solid #434e5b; overflow: hidden;
  }
  .cap { color: #8b95a1; max-width: 52ch; text-align: center; }
  .cap b { color: #eef2f7; font-weight: 600; }
  button {
    font: inherit; color: #eef2f7; background: #29343f; border: 1px solid #434e5b;
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  button:hover { background: #36414d; }
</style>
</head>
<body>
  <div class="stage">
    <div class="card"><svg id="svg" viewBox="0 0 480 300"></svg></div>
    <p class="cap"><b>The lab takes the shape of your data.</b> A flat framework
    grid; the dataset arrives; the grid bends to fit, and the Einstein ring
    lights where the deflection peaks. Loops. Honors reduced-motion (holds the
    formed state).</p>
    <button id="replay">Replay</button>
  </div>

<script>
const CX = 240, CY = 150, RE = 78;
const GRID_HEX = "#566372"; // on-chrome lattice line

// --- OKLCH -> sRGB + velocity ramp (dark anchors), ported from make_mark.py ---
function labHex(L,a,b){
  const l=(L+0.3963377774*a+0.2158037573*b)**3,
        m=(L-0.1055613458*a-0.0638541728*b)**3,
        s=(L-0.0894841775*a-1.2914855480*b)**3;
  let r=4.0767416621*l-3.3077115913*m+0.2309699292*s,
      g=-1.2684380046*l+2.6097574011*m-0.3413193965*s,
      bb=-0.0041960863*l-0.7034186147*m+1.7076147010*s;
  const f=x=>{x=Math.max(0,Math.min(1,x));return x<=0.0031308?12.92*x:1.055*x**(1/2.4)-0.055;};
  const h=v=>Math.round(f(v)*255).toString(16).padStart(2,"0");
  return "#"+h(r)+h(g)+h(bb);
}
function oklch(L,C,H){const h=H*Math.PI/180;return labHex(L,C*Math.cos(h),C*Math.sin(h));}
const ANCH=[[0.58,0.20,26],[0.76,0.17,52],[0.82,0.10,240]];
function ramp(t){t=Math.max(0,Math.min(1,t));let p,q,f;
  if(t<0.5){p=ANCH[0];q=ANCH[1];f=t*2;}else{p=ANCH[1];q=ANCH[2];f=(t-0.5)*2;}
  return oklch(p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f,p[2]+(q[2]-p[2])*f);}

function deflect(x,y,strength,minr=0.46,core=0.55){
  const dx=x-CX,dy=y-CY,r=Math.hypot(dx,dy); if(r<1e-6)return[x,y];
  const ru=r/RE,p=strength/Math.sqrt(ru*ru+core*core),nru=Math.max(ru-p,minr);
  return [CX+dx/r*(nru*RE),CY+dy/r*(nru*RE)];
}

const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg");
const gGrid=document.createElementNS(NS,"g");
const ringSegs=[];
const mass=document.createElementNS(NS,"circle");
svg.append(gGrid);

// build grid polylines + ring segments + mass once; update attrs per frame
const step=30, n=9, samp=36, lo=CX-n*step, hiX=CX+n*step, loY=CY-6*step, hiY=CY+6*step;
const lines=[];
for(let k=-n;k<=n;k++){const e=document.createElementNS(NS,"polyline");e.setAttribute("fill","none");e.setAttribute("stroke",GRID_HEX);e.setAttribute("stroke-width","1");e.setAttribute("stroke-linecap","round");gGrid.append(e);lines.push({el:e,fixed:CX+k*step,axis:"x"});}
for(let k=-6;k<=6;k++){const e=document.createElementNS(NS,"polyline");e.setAttribute("fill","none");e.setAttribute("stroke",GRID_HEX);e.setAttribute("stroke-width","1");e.setAttribute("stroke-linecap","round");gGrid.append(e);lines.push({el:e,fixed:CY+k*step,axis:"y"});}
const NSEG=64, ring=document.createElementNS(NS,"g"); svg.append(ring);
for(let i=0;i<NSEG;i++){const e=document.createElementNS(NS,"path");e.setAttribute("fill","none");e.setAttribute("stroke-width","4");e.setAttribute("stroke-linecap","round");const t=(1-Math.cos((i+0.5)/NSEG*2*Math.PI-Math.PI))/2;e.setAttribute("stroke",ramp(t));ring.append(e);ringSegs.push(e);}
mass.setAttribute("fill","#11161c"); svg.append(mass);
const rim=document.createElementNS(NS,"circle"); rim.setAttribute("fill","none"); rim.setAttribute("stroke","#7d8896"); rim.setAttribute("stroke-opacity","0.6"); svg.append(rim);

function setPoly(o,strength){
  const pts=[];
  for(let i=0;i<=samp;i++){
    let x,y;
    if(o.axis==="x"){x=o.fixed;y=loY+(hiY-loY)*i/samp;}else{x=lo+(hiX-lo)*i/samp;y=o.fixed;}
    const [px,py]=deflect(x,y,strength);
    pts.push(px.toFixed(1)+","+py.toFixed(1));
  }
  o.el.setAttribute("points",pts.join(" "));
}
function arcPath(r,a0,a1){const x0=CX+r*Math.cos(a0),y0=CY+r*Math.sin(a0),x1=CX+r*Math.cos(a1),y1=CY+r*Math.sin(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;}

function frame(strength, ringReveal, massScale){
  for(const o of lines) setPoly(o,strength);
  const mr=RE*0.30*massScale;
  mass.setAttribute("cx",CX);mass.setAttribute("cy",CY);mass.setAttribute("r",Math.max(0.1,mr));
  rim.setAttribute("cx",CX);rim.setAttribute("cy",CY);rim.setAttribute("r",Math.max(0.1,mr));rim.setAttribute("stroke-width",(mr*0.07).toFixed(2));
  const shown=Math.floor(NSEG*ringReveal);
  for(let i=0;i<NSEG;i++){
    if(i<shown){const a0=i/NSEG*2*Math.PI-0.01,a1=(i+1)/NSEG*2*Math.PI+0.01;ringSegs[i].setAttribute("d",arcPath(RE,a0,a1));ringSegs[i].setAttribute("opacity","0.95");}
    else ringSegs[i].setAttribute("opacity","0");
  }
}

const easeOut=t=>1-Math.pow(1-t,3);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let start=null, raf=null;
const DUR={mass:700, warp:1100, ring:900, hold:1400, fade:700};
function play(ts){
  if(start===null)start=ts;
  let e=ts-start;
  // phases: mass-in -> warp -> ring -> hold -> fade(reset)
  let strength, ringR, mscale;
  if(e<DUR.mass){mscale=easeOut(e/DUR.mass);strength=0;ringR=0;}
  else if(e<DUR.mass+DUR.warp){mscale=1;strength=easeOut((e-DUR.mass)/DUR.warp);ringR=0;}
  else if(e<DUR.mass+DUR.warp+DUR.ring){mscale=1;strength=1;ringR=easeOut((e-DUR.mass-DUR.warp)/DUR.ring);}
  else if(e<DUR.mass+DUR.warp+DUR.ring+DUR.hold){mscale=1;strength=1;ringR=1;}
  else if(e<DUR.mass+DUR.warp+DUR.ring+DUR.hold+DUR.fade){const f=easeOut((e-DUR.mass-DUR.warp-DUR.ring-DUR.hold)/DUR.fade);mscale=1-f;strength=1-f;ringR=1-f;}
  else {start=ts;e=0;mscale=0;strength=0;ringR=0;}
  frame(strength,ringR,mscale);
  raf=requestAnimationFrame(play);
}
const frozen = new URLSearchParams(location.search).has("frozen");
function run(){if(raf)cancelAnimationFrame(raf);start=null;if(reduce||frozen){frame(1,1,1);}else{raf=requestAnimationFrame(play);}}
document.getElementById("replay").onclick=run;
run();
</script>
</body>
</html>
