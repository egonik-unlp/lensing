# Domain configuration: everything that ties this framework to one concrete
# prediction problem. Bootstrapping a new project = editing this file (see
# BOOTSTRAP.md). This copy is a NEUTRAL PLACEHOLDER — the template ships
# unconfigured; run /bootstrap to interview your way to a real domain. A
# complete worked example (the framework's original real-estate price
# problem, exercising every lever including [currency], [coordinates] and
# reconciled fields) lives at crates/lensing-core/src/example-domain.toml.
#
# Rules of the road:
# - Field order is load-bearing: feature columns are emitted numerics-first
#   then categoricals, each in the order declared here. Reordering fields
#   changes new datasets' column layout (frozen models are unaffected —
#   contracts are self-describing).
# - Field `name`s are payload JSON keys AND the items.json keys predictors
#   read. Renaming a field is a corpus-schema statement, not cosmetics.
# - Quality rule keys ("price-range", "bedrooms-outlier", …) are stable
#   internal identifiers; a new domain rebinds them to its fields and
#   relabels them, it does not rename them.

schema_version = 1

[project]
name = "unconfigured"
title = "Unconfigured Lensing Instance"
entity_noun = "item"
entity_noun_plural = "items"
target_noun = "target"

# Instance personality inside the lensing brand grammar. The velocity-map
# mark (dark sphere + red/blue shifted trail swarm) and the Sora wordmark
# are constants; an instance reseeds the arc arrangement and may rotate the
# ramp hue. The server ignores this section — it is read by the generator:
#   python3 branding/make_mark.py --install
# mark_seed "lensing" is the canonical mark; bootstrapped instances usually
# set it to their project name.
[branding]
mark_seed = "lensing"
mark_hue_shift = 0

[corpus]
qdrant_url = "http://localhost:6333"
collection = "corpus"
manual_collection = "manual-entries"
embedding_dim = 1536
# Payload key the metadata fields nest under ("" = payload root).
metadata_root = "metadata"
# Payload-root key holding the embedded document text.
content_field = "content"

# The corpus point filter (translated 1:1 into a Qdrant filter; field names
# get the metadata_root prefix automatically). Empty = take every point.
[corpus.filter]
desc = "all points"
must = []
must_not = []

[target]
field = "target"
# "log1p" trains on log(1+target) — right for heavy-tailed positive targets
# like prices; "none" trains on the raw value.
transform = "none"

[target.format]
style = "number" # "money" renders with the symbol + locale grouping
symbol = ""
locale = "en-US"

[metrics]
primary = "MAE"
# Available metric names: MAE, RMSE, R², MAPE, medAPE.
columns = ["MAE", "RMSE", "R²"]
percent = []
value_unit = "units"
# Size cap of the auto-maintained best-models group (pins may exceed it).
best_models_size = 12

# ---- Fields: the corpus payload schema ----
# roles: target | categorical | numeric | coordinates | filter_only |
#        timestamp | display
# numeric options: encode = "raw"|"log1p", indicator (emit _missing column),
#                  zero_is_missing, reconcile (joined from a companion
#                  collection by point id), group (toggle-group name)
# categorical options: vocab = "all" | { top_n = N }, critical (counted by
#                      the missing-fields rule), path = "payload" for
#                      payload-root fields
#
# The two *_example fields below are placeholders — replace them with your
# corpus's real schema during /bootstrap.

[[fields]]
name = "target"
role = "target"

[[fields]]
name = "numeric_example"
role = "numeric"
encode = "raw"
default_on = true

[[fields]]
name = "category_example"
role = "categorical"
vocab = "all"
default_on = true

# [coordinates] — only with a coordinates-role field; declares plausible
# lat/lon bounds (out-of-bounds geocodes count as missing). See the worked
# example for a full configuration.

# [currency] — only for multi-currency corpora (kept currency, rate source,
# reconcile collection). Single-currency domains omit the section entirely.
# See the worked example for a full configuration.

# Quality-rule bindings + display labels (rule keys are stable identifiers).
# outlier_group / capped_numeric bind the grouped-outlier and capped-numeric
# rules to your fields; unbound rules simply never flag anything.
[quality]

# Interpretability-subsystem parameters (the /api/interp/* probe tools). All
# optional; empty values fall back to the domain's own fields.
[interp]
# Categorical field the embedding / SAE probes slice rows by. "" = the first
# categorical field declared above.
segment_field = ""

# Agentic-layer parameters, consumed by agents-src/render.py (NOT by the
# Rust code) to render the skills/agents under .claude/, .agents/, .gemini/.
# After editing anything in this file, run: zig build render-agents
[agents]
api_base_url = "http://localhost:8080"
report_dir = "experiments"
facts_file = "experiments/PROJECT-FACTS.md"
definition_naming = "<predictor>-<slug>"
definition_naming_example = ""
# Render the ingestion agent (listing-generator)? Domains without a
# scrape-from-the-web ingestion story set this to false.
ingestion = true

# Deployment (Docker). Consumed by scripts/render-deploy-env.py to seed the
# deploy knobs in .env; the Rust server IGNORES this section. compose_project
# prefixes container/network/volume names so multiple instances coexist on one
# host (D1) — leave unset to derive it from [project].name. The *_port values
# are HOST-side mappings; container-internal ports are fixed (hub 8080, infer
# 8090, postgres 5432). Bump them per instance to avoid collisions on a shared
# host, exactly like the port-partitioning of qdrant_url above.
[deploy]
compose_project = ""
hub_port = 8080
infer_port = 8090
db_port = 5433
# Qdrant publishes two host ports. REST (6333) is what the server, the
# pipeline and /bootstrap's probing use, and what [corpus] qdrant_url points
# at; gRPC (6334) is what lensing-intake's [[sink]] needs, since it reaches
# Qdrant through lvv -> qdrant-client, which is gRPC-only. Give each instance
# its own pair or they collide when both run `--profile qdrant`.
qdrant_port = 6333
qdrant_grpc_port = 6334

[quality.rule_labels]
"nonpositive-price" = "target ≤ 0"
"price-outlier" = "target outlier"
"missing-fields" = "missing fields"
"price-range" = "target out of range"
"bedrooms-outlier" = "capped-numeric outlier"
"duplicate-content" = "duplicate content"
"short-content" = "thin content"
"foreign-currency" = "foreign currency"

# ---- Ranking / next-item task (OPTIONAL) ----
# To make this a next-item RANKING instance instead of pointwise regression,
# set [target].task = "ranking" and add a [sequence] block. Absent ⇒ pointwise.
# The dataset is built by an external sequences producer as ordered per-session
# item sequences (sequence-manifest.json + item_latents.f32 + items.json + the
# session arrays); a ranking predictor exposes a `predict` subcommand and reuses
# predictors/ranking_serve.py. Example:
#
# [target]
# task = "ranking"
#
# [sequence]
# session_field = "session_id"   # payload field grouping events into a session
# order_field   = "ts"           # intra-session order (a timestamp field)
# gap_minutes   = 30
# latent_source = "my_item_latents"   # Qdrant collection of per-item latents
# identity_field = "id"          # items.json field a serving prefix token matches
# relevance_fields = []          # optional graded-relevance item fields (<field>@k)
#
# [metrics]
# primary = "recall@10"
# columns = ["recall@10", "mrr", "hit@10"]
