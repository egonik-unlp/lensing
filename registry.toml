# Predictor registry. Each entry is an executable implementing the contract
# documented in README.md. {dataset}, {run_dir}, {hyperparams} are substituted
# by lensing-server; commands run from the repository root.

[[predictors]]
name = "burn-mlp"
display_name = "MLP (burn)"
language = "Rust"
framework = "burn"
description = "Feed-forward net on PCA embeddings + metadata one-hots. Rust, CPU."
command = "target/release/predictor-burn-mlp"
args = ["train", "--dataset", "{dataset}", "--output", "{run_dir}", "--hyperparams", "{hyperparams}"]
predict_args = ["predict", "--model", "{model}", "--input", "{input}", "--output", "{output}"]
export_args = ["export", "--model", "{model}", "--output", "{output}"]
supports_stop = true
visualization = true

[[predictors.params]]
name = "epochs"
type = "int"
default = 50
min = 1
max = 100000

[[predictors.params]]
name = "checkpoint_every"
label = "checkpoint every N epochs"
type = "int"
default = 0
min = 0
max = 100000

[[predictors.params]]
name = "patience"
label = "early-stop patience (epochs, 0 = off)"
type = "int"
default = 0
min = 0
max = 10000

[[predictors.params]]
name = "val_fraction"
label = "early-stop validation fraction (of train)"
type = "float"
default = 0.15
min = 0.05
max = 0.5

[[predictors.params]]
name = "lr"
label = "learning rate"
type = "float"
default = 0.001
min = 0.000001
max = 1.0

[[predictors.params]]
name = "batch_size"
label = "batch size"
type = "int"
default = 256
min = 8
max = 8192

[[predictors.params]]
name = "hidden"
label = "hidden layers"
type = "ints"
default = [256, 128]

[[predictors.params]]
name = "dropout"
type = "float"
default = 0.1
min = 0.0
max = 0.9

[[predictors.params]]
name = "activation"
label = "hidden-layer activation"
type = "enum"
default = "relu"
options = ["relu", "gelu", "silu", "mish", "tanh", "leaky_relu", "selu", "elu"]

[[predictors.params]]
name = "clamp_output"
label = "clamp predictions at ~2x max train target"
type = "bool"
default = false

