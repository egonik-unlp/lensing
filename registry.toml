[[predictors]]
name = "blend"
display_name = "Blend (ensemble)"
language = "Rust"
description = "Meta-predictor: combines member models' target-space predictions by weighted mean or median vote. Members are frozen promoted models ({\"model\": …}), models.toml definitions trained inside the run ({\"definition\": …}), or inline recipes ({\"predictor\": …, \"hyperparams\": …}); each takes an optional weight and exclude_blocks column mask."
